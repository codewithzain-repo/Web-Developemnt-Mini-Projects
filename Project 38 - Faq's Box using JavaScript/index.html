        <div class="faq-box">
            <h1>What is Google</h1>

            <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="30" height="30"
                        viewBox="0 0 24 24">
                        <path fill-rule="evenodd"
                            d="M 11 2 L 11 11 L 2 11 L 2 13 L 11 13 L 11 22 L 13 22 L 13 13 L 22 13 L 22 11 L 13 11 L 13 2 Z">
                        </path>
                    </svg>

                    <div class="faq-answer">
                       Google is an American multinational technology corporation and the world's most widely used internet search engine. Founded in September 1998 by Larry Page and Sergey Brin at Stanford University, it operates as a subsidiary of its parent company, Alphabet Inc.
                    </div>
                
        </div>
