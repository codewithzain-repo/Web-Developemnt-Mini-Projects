    <title>Building YouTube Video Card</title>
    

    
<style>
    body {
        background-color: rgba(0, 0, 0, 0.877);
    }

    .container {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .card {
        display: flex;
        align-items: flex-start;
        gap: 20px;
        border: 1px solid black;
        width: 700px;
        max-width: 100%;
        padding: 10px;
        position: relative;
        background-color: rgba(0, 0, 0, 0.89);
        box-sizing: border-box;
    }

    h1 {
        font-size: 15px;
        color: white;
        margin: 5px 0 10px;
    }

    p {
        color: white;
        margin: 0;
    }

    .image {
        position: relative;
        flex-shrink: 0;
        width: 168px;
        height: 94px;
    }

    .image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 10px;
        display: block;
    }

    .capsule {
        position: absolute;
        bottom: 5px;
        right: 5px;
        left: auto;
        color: white;
        background-color: rgba(0, 0, 0, 0.76);
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 12px;
    }

    .text {
        min-width: 0;
        flex: 1;
    }
</style>
</head>
